name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: uv.lock
      - name: Install uv
        run: python -m pip install uv==0.11.18
      - name: Install development dependencies
        run: uv sync --locked --extra dev --extra plots
      - name: Lint
        run: uv run --no-sync python -m ruff check .
      - name: Format check
        run: uv run --no-sync python -m ruff format --check .
      - name: Unit tests
        run: uv run --no-sync python -m pytest
      - name: Claim contract
        run: uv run --no-sync python -m scripts.check_claim_contract
      - name: Normalized evidence
        run: uv run --no-sync python -m scripts.verify_evidence
      - name: Human label audit snapshot
        run: uv run --no-sync python -m scripts.publish_human_label_audit verify
      - name: Reproducibility package
        run: uv run --no-sync python -m scripts.check_reproducibility_package
      - name: Anonymous export
        run: uv run --no-sync python -m scripts.export_anonymous_artifact --output tmp/anonymous_artifact
      - name: Verify anonymous artifact independently
        working-directory: tmp/anonymous_artifact
        run: |
          uv sync --locked --extra dev --extra plots
          uv run --no-sync python -m pytest
          uv run --no-sync python -m ruff check .
          uv run --no-sync python -m ruff format --check .
          uv run --no-sync python -m scripts.check_claim_contract
          uv run --no-sync python -m scripts.verify_evidence
          uv run --no-sync python -m scripts.publish_human_label_audit verify
          uv run --no-sync python -m scripts.check_reproducibility_package
