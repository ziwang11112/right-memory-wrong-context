[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-agent-memory"
version = "0.1.0"
description = "Evaluation artifact for The Right Memory in the Wrong Context: Verifying Retrieval Admissibility in Long-Term Agent Memory."
readme = "README.md"
authors = [
    {name = "Zi Wang"},
    {name = "Xingqiao Wang"},
    {name = "Emmanuel Addai"},
    {name = "Devika Ambekar"},
    {name = "Xiaowei Xu"},
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/ziwang11112/right-memory-wrong-context"
Documentation = "https://github.com/ziwang11112/right-memory-wrong-context/blob/main/REPRODUCIBILITY.md"
Issues = "https://github.com/ziwang11112/right-memory-wrong-context/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.12",
]
plots = [
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
