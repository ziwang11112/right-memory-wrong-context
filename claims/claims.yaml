      - "Within 16 curated evaluation packets, namespace support preserved observed recall and removed observed wrong-namespace leakage."
    forbidden_wording:
      - "The 16 packets estimate natural-corpus performance."
      - "The smoke is an official RHELM or MemOps benchmark result."
      - "The smoke and 3,767-query evaluation are one population."
    known_limitations:
