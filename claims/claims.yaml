        lower: -0.24919584095473782
        upper: -0.19190426898466853
      - metric: "utility_accuracy_delta"
        estimate: -0.16895604395604397
        lower: -0.2079222024766579
        upper: -0.1307901907356948
      - metric: "over_refusal_delta"
        estimate: 0.28708791208791207
        lower: 0.23378334503334502
        upper: 0.3404877624405521
    allowed_wording:
      - "Reducing exposure lowered leakage but incurred a bounded utility and over-refusal cost."
      - "The results expose a safety-utility verification problem."
    forbidden_wording:
      - "The stricter policy is uniformly better."
      - "Filtering protected memories is free."
      - "The policy comparison establishes a causal treatment effect."
    known_limitations:
      - "This is a non-causal comparison over frozen benchmark routes."
      - "The estimates come from one OpenAI reader and do not constitute a cross-provider result; the broader reader evidence is same-provider."
      - "Leakage and bounded utility use different eligible checkpoint populations."
      - "Utility accuracy is benchmark-bounded and is not a complete measure of user value."
    verification_tests:
      - "test_gatemem_claim_requires_non_causal_limitation"
      - "test_gatemem_claim_requires_same_provider_limitation"
      - "test_confidence_intervals_contain_estimates"

