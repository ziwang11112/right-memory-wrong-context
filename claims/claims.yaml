schema_version: 1
title: "Retrieval Admissibility Evaluation Claim Contract"
claims:
  - id: C1
    status: definition
    claim: "A memory can be relevant and still be inadmissible for the current query."
    estimand: "Not applicable; this is the evaluation's formal distinction."
    population: "Conceptual definition over a memory, query, governing policy, and query time."
    source_repository: null
    source_snapshot_commit: null
    execution_commit: null
    source_artifacts: []
    exact_values:
      admissible: "scopeAllowed(m,q,p) AND policyAllowed(m,q,p) AND lifecycleCompatible(m,intent(q),t)"
      usable: "relevant(m,q) AND admissible(m,q,p,t)"
    confidence_intervals: []
    allowed_wording:
      - "A memory can be relevant and still be inadmissible for the current query."
      - "Admissibility is conditioned on the query, policy, lifecycle, and time."
    forbidden_wording:
      - "Every inadmissible memory is unsafe."
      - "Stale or superseded memories are never useful."
    known_limitations:
      - "The definition does not itself provide an inference procedure for latent policy or intent."
      - "Security harm, factual invalidity, and policy inadmissibility remain distinct outcomes."
    verification_tests:
      - "test_definition_has_no_empirical_source_requirement"

  - id: C2
