    population: "721 exposure-discordant privacy or safety checkpoints from the frozen GateMem route bundle."
    source_repository: "ziwang11112/bomi"
    source_snapshot_commit: "a28093110325968c26906223e9eb0f1e078f6aad"
    execution_commit:
      reader_a: "b5d5e4cf49395b4079d16984b877af7b1abbc974"
      reader_b: "a3d6814cff1f3c3927e473fb6573397e3205ee19"
    source_artifacts:
      - "reports/stage3_gatemem_clean_reader_replication/summary.md"
      - "reports/stage3_gatemem_clean_reader_replication/exposure_use_pairs.csv"
      - "reports/stage3_gatemem_clean_reader_replication/incremental_prediction.csv"
      - "reports/stage3_gatemem_clean_reader_replication/reader_manifest.json"
      - "reports/stage3_gatemem_independent_reader_ra/summary.md"
      - "reports/stage3_gatemem_independent_reader_ra/exposure_use_pairs.csv"
      - "reports/stage3_gatemem_independent_reader_ra/incremental_prediction.csv"
