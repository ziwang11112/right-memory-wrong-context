      - "reports/stage3_gatemem_clean_reader_replication/arm_summary.csv"
      - "reports/stage3_gatemem_clean_reader_replication/reader_manifest.json"
    exact_values:
      answer_leakage_delta: -0.22013422818791947
      utility_accuracy_delta: -0.16895604395604397
      over_refusal_delta: 0.28708791208791207
      leakage_checkpoints: 1490
      utility_checkpoints: 728
    confidence_intervals:
