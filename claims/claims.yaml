    exact_values:
      discordant_checkpoints: 721
      reader_a:
        model: "gpt-4o-mini-2024-07-18"
        provider: "OpenAI"
        risk_difference: 0.42857142857142855
        brier_delta: -0.022532058295752052
        log_loss_delta: -0.052176096341620244
      reader_b:
        model: "gpt-4o-2024-08-06"
        provider: "OpenAI"
        risk_difference: 0.5298196948682385
        brier_delta: -0.025471408519865714
        log_loss_delta: -0.06326847394150133
      pooled_estimate: null
    confidence_intervals:
      - metric: "reader_a_risk_difference"
        estimate: 0.42857142857142855
        lower: 0.39190435383198613
        upper: 0.4642384321256642
      - metric: "reader_a_brier_delta"
        estimate: -0.022532058295752052
        lower: -0.02782301100400668
        upper: -0.017385537398860413
      - metric: "reader_a_log_loss_delta"
        estimate: -0.052176096341620244
        lower: -0.06427873215287494
        upper: -0.0395736828480233
      - metric: "reader_b_risk_difference"
        estimate: 0.5298196948682385
        lower: 0.49152311368076457
        upper: 0.5664938149261891
      - metric: "reader_b_brier_delta"
        estimate: -0.025471408519865714
        lower: -0.031048185987606974
        upper: -0.019952787487257893
      - metric: "reader_b_log_loss_delta"
        estimate: -0.06326847394150133
        lower: -0.0778269788796231
        upper: -0.04864365440321049
    allowed_wording:
      - "Across fixed checkpoints and separately executed readers, target exposure was strongly associated with answer leakage."
      - "Adding exposure improved held-out leakage prediction for each reader."
    forbidden_wording:
      - "Exposure causally mediates answer leakage."
      - "The result is a cross-provider replication."
      - "The two readers were pooled into one effect estimate."
      - "This is an official GateMem benchmark result."
    known_limitations:
      - "The comparison is associative and non-causal."
      - "Both readers are from OpenAI, so this is same-provider cross-reader robustness, not cross-provider replication."
      - "Reader estimates are reported separately and are never pooled."
      - "The result is open-label and is not an official GateMem benchmark submission."
    verification_tests:
      - "test_gatemem_claim_requires_non_causal_limitation"
      - "test_gatemem_claim_requires_same_provider_limitation"
      - "test_confidence_intervals_contain_estimates"

  - id: C3
