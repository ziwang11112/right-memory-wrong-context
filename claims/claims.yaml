    allowed_wording:
      - "On frozen natural-corpus rankings, trusted namespace support improved recall, feasibility, and post-hoc v2 penalized admissibility upper risk at top-k 10, 20, 50, and 100."
      - "The v2 risk reduction contains both an infeasibility reduction and a smaller feasible-prefix admissibility component at every reported depth."
      - "At comparable candidate counts, the correct trusted namespace achieved 0.533 recall while a ten-seed size-matched random partition achieved 0.061 mean recall, so pool size alone does not explain the result in this exact-dense control."
      - "A non-deployable gold-preserving same-size oracle reached 0.840 mean recall and 0.747 feasibility, exposing substantial support and ranking headroom when released required anchors are known."
      - "Hiding 20 percent of established evaluator judgments changed neither route nor recall but reduced coverage to 0.786/0.793 and widened the global/namespace partial-identification intervals to 0.214/0.207."
      - "Global post-filtering recovered namespace-pre-filter recall only after retrieving to depth 500; filtering a global top-20 retained global recall."
      - "After removing scope violations from the numerator, conditional upper risk did not improve, and the penalized residual-risk advantage required a positive infeasibility cost."
      - "Leave-one-group-out recall deltas remained positive, and the exact seven-group RHELM sign-flip p-value was 0.015625."
      - "Omitting only the released policy-disallowed predicate preserved the top-20 namespace-support advantage in penalized upper risk, any known violation, and known-violation count."
    forbidden_wording:
      - "The v2 admissibility metric was used for original development selection."
      - "The fixed-budget analysis is a new held-out confirmatory experiment."
      - "Namespace support guarantees admissibility at any retrieval depth."
      - "Candidate-pool size never matters for dense retrieval."
      - "Correct namespace identity is necessary or sufficient for optimal retrieval."
      - "The gold-preserving support control is deployable or does not use released gold."
      - "Evaluator-label missingness changes retrieval performance."
      - "Trusted namespace support improves conditional policy or lifecycle verification."
    known_limitations:
      - "This is a post-hoc v2 rescore of frozen rankings, not a new held-out run."
      - "No settings were retuned, and original development selection used the v1 penalized non-usable upper risk."
      - "Confidence intervals use namespace-group bootstrap resampling under equal-source macro-averaging."
      - "The result applies to released trusted namespaces in the evaluated public sources."
      - "The support controls are post-hoc zero-call diagnostics on frozen embeddings and labels; the random partition is not a semantic-cluster control."
      - "The gold-preserving same-size arm is an oracle attribution diagnostic because it retains released required anchors; it is not a routing method."
      - "The missingness sensitivity hides established evaluator judgments after retrieval; it motivates bounds but is not a model of deployment-time metadata corruption."
      - "The pre/post-filter comparison is specific to exact dense ranking and the tested depths."
      - "At zero infeasibility cost, namespace scope-excluded penalized risk is slightly higher than global dense; the primary residual advantage therefore depends on assigning positive cost to recall failure."
      - "The policy-axis analysis is a zero-call sensitivity on the same frozen top-20 routes and source-required anchors; it does not validate policy labels or establish that policy verification is unnecessary."
    verification_tests:
      - "test_fixed_budget_claim_requires_posthoc_no_retuning_boundary"
      - "test_confidence_intervals_contain_estimates"
      - "test_policy_omission_preserves_namespace_advantage"

